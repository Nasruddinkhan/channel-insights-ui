apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: channel-insights-docker-push
spec:
  params:
    - name: image
      type: string
  workspaces:
    - name: shared
      readOnly: true
    - name: registry-auth
      readOnly: true
  steps:
    - name: push
      image: quay.io/skopeo/stable:latest
      env:
        - name: IMAGE
          value: $(params.image)
        - name: IMAGE_ARCHIVE
          value: $(workspaces.shared.path)/image.tar
        - name: AUTH_FILE
          value: $(workspaces.registry-auth.path)/.dockerconfigjson
      script: |
        #!/bin/sh
        set -eu
        skopeo copy \
          --authfile "$AUTH_FILE" \
          "oci-archive:$IMAGE_ARCHIVE" \
          "docker://$IMAGE"
