apiVersion: v1
kind: ConfigMap
metadata:
  name: channel-insights-nginx
  namespace: nasruddinkhan786-dev
  labels:
    app: channel-insights-ui
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        access_log /dev/stdout;
        sendfile on;

        client_body_temp_path /tmp/client_temp;
        proxy_temp_path /tmp/proxy_temp;
        fastcgi_temp_path /tmp/fastcgi_temp;
        uwsgi_temp_path /tmp/uwsgi_temp;
        scgi_temp_path /tmp/scgi_temp;

        include /etc/nginx-custom/default.conf;
    }
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_types text/css application/javascript application/json;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # JSON mock responses must remain JSON, even when a file is missing.
        location ~* ^/assets/.*\.json$ {
            add_header Cache-Control "no-store";
            try_files $uri =404;
        }

        # Vite names production JS and CSS files with content hashes.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # React Router handles deep links such as /feature-summary/LEAVE.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
