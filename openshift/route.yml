apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: channel-insights-ui
  namespace: nasruddinkhan786-dev
  labels:
    app: channel-insights-ui
spec:
  # OpenShift generates a hostname using the cluster's applications domain.
  to:
    kind: Service
    name: channel-insights-ui
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
