server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # JSON mock responses must remain JSON, even when a file is missing.
    location ~* ^/assets/.*\.json$ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Vite names production JS and CSS files with content hashes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router handles deep links such as /feature-summary/LEAVE.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
